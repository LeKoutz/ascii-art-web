<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>ASCII Art</title>
</head>

<body>
    <h1>ASCII Art</h1>

    <form method="POST" action="/ascii-art">
        <label for="text">Text</label>
        <textarea id="text" name="text" maxlength="500">{{.InputText}}</textarea>

        <div class="row">
            <label for="banner">Banner</label>
            <select id="banner" name="banner">
                {{ $current := .InputBanner }}
                {{ range .Banners }}
                {{ $name := . }}
                <option value="{{$name}}" {{if eq $name $current}}selected{{end}}>{{$name}}</option>
                <!-- In HTML, an <option> is preselected when it has the boolean attribute selected inside its opening-->
                {{ end }}
            </select>
        </div>

        <div class="center">
            <button type="submit">Generate</button>
        </div>
    </form>

    {{if .AsciiArt}}
    <h2 style="color:#FF3355;">Result</h2>
    <pre class="result">{{.AsciiArt}}</pre>
    {{end}}
</body>

</html>
